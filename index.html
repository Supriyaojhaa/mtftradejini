<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f8fafc"/><script>(function(){try{var s=localStorage.getItem("mtf_theme")||localStorage.getItem("theme");var t=(s==="dark")?"dark":"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.dataset.theme=t;if(t==="dark"){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#050b16");}}catch(e){document.documentElement.setAttribute("data-theme","light");document.documentElement.dataset.theme="light";}})();</script><title>MTF Analytics</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
